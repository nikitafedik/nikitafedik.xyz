<!doctype html>
<meta charset="utf-8">
<title>env decode check</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js", "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.min.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/" } }</script>
<script type="module">
// Decode img/room-env.webp with the old JS loop and the new GPU pass, then compare every texel (half-float bits).
import * as THREE from 'three';
import { FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
const SRC = '/cur/img/room-env.webp';
const img = new Image(); img.src = SRC; await img.decode();
const W2 = img.width, w = W2 / 2, h = img.height;
// old: canvas readback and a JS loop
const bmp = await createImageBitmap(img, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
const c = document.createElement('canvas'); c.width = W2; c.height = h;
const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(bmp, 0, 0);
const src = g.getImageData(0, 0, W2, h).data, old = new Uint16Array(w * h * 4), toHalf = THREE.DataUtils.toHalfFloat, one = toHalf(1);
let t0 = performance.now();
for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
  const m = (y * W2 + x) * 4, e = m + w * 4, o = (y * w + x) * 4;
  if (!src[e]) continue;
  const f = 2 ** (src[e] - 136);
  old[o] = toHalf(src[m] * f); old[o + 1] = toHalf(src[m + 1] * f); old[o + 2] = toHalf(src[m + 2] * f); old[o + 3] = src[e + 1] ? one : 0;
}
const jsMs = performance.now() - t0;
// new: the GPU pass, the same code as reel3d.js
const renderer = new THREE.WebGLRenderer();
const RGBE_DECODE = `uniform sampler2D tSrc; uniform vec2 uSize;
  void main() {
    vec2 p = gl_FragCoord.xy;
    vec4 m = texture2D(tSrc, vec2(p.x / (2.0 * uSize.x), p.y / uSize.y));
    vec4 e = texture2D(tSrc, vec2((p.x + uSize.x) / (2.0 * uSize.x), p.y / uSize.y));
    float E = floor(e.r * 255.0 + 0.5);
    gl_FragColor = E > 0.0 ? vec4(floor(m.rgb * 255.0 + 0.5) * exp2(E - 136.0), e.g > 0.5 ? 1.0 : 0.0) : vec4(0.0);
  }`;
t0 = performance.now();
const tex = Object.assign(new THREE.Texture(img), { colorSpace: THREE.NoColorSpace, premultiplyAlpha: false, flipY: false, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, generateMipmaps: false, needsUpdate: true });
const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false, depthBuffer: false });
const quad = new FullScreenQuad(new THREE.ShaderMaterial({ uniforms: { tSrc: { value: tex }, uSize: { value: new THREE.Vector2(w, h) } }, vertexShader: 'void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }', fragmentShader: RGBE_DECODE, depthTest: false, depthWrite: false, toneMapped: false }));
renderer.setRenderTarget(rt); quad.render(renderer);
const gpuMs = performance.now() - t0;
const out = new Uint16Array(w * h * 4);
await renderer.readRenderTargetPixelsAsync(rt, 0, 0, w, h, out);
renderer.setRenderTarget(null);
let diff = 0, diffBig = 0, maxRel = 0;
const fromHalf = THREE.DataUtils.fromHalfFloat;
for (let i = 0; i < out.length; i++) if (out[i] !== old[i]) { diff++; const a = fromHalf(old[i]), b = fromHalf(out[i]), r = Math.abs(a - b) / Math.max(Math.abs(a), 1e-6); if (r > maxRel) maxRel = r; if (Math.abs(out[i] - old[i]) > 1) diffBig++; }
window.__result = { texels: w * h, values: out.length, differing: diff, differingByMoreThanOneUlp: diffBig, maxRelativeDifference: maxRel, jsMs: +jsMs.toFixed(1), gpuMs: +gpuMs.toFixed(1) };
document.body.textContent = JSON.stringify(window.__result);
</script>
